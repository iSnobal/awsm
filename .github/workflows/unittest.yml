name: Tests - Release Tags

on:
  pull_request:
    types: [labeled]
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest-release:
    if: github.event.label.name == 'release' || github.event_name == 'push'
    uses: ./.github/workflows/test_base.yml
    with:
      latest: false
