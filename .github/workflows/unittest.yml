name: Unittest

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - '**.md'
      - .gitignore
      - .editorconfig
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-11
      GCC_VERSION: 11

    steps:
      - uses: actions/checkout@v5

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          # Download environment file
          wget https://raw.githubusercontent.com/iSnobal/model_setup/refs/heads/main/conda/isnobal_linux.yaml
          # Install GCC
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          # Update alternatives for system-wide default
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 100
          # Check
          gcc --version
          g++ --version
        shell: bash

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: isnobal_linux.yaml
          init-shell: bash
          cache-environment: true
          cache-environment-key: conda-${{ runner.os }}-gcc_${{ env.GCC_VERSION }}-${{ hashFiles('isnobal_linux.yaml') }}

      - name: Run unittests
        run: |
          micromamba run -n isnobal make install
          micromamba run -n isnobal make tests

