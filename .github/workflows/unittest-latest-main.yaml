name: Tests - latest HEAD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - "**.md"
      - .gitignore
      - .editorconfig

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    uses: ./.github/workflows/test_base.yml
    with:
      latest: main
